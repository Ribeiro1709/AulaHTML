<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 4</title>

    <style>
        h1 {
            background-color: darkorchid;
            color: aliceblue;
            padding: 20px;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }
        h3
        {
            color: blue;
        }
        td
        {text-align: center;}
    </style>
</head>

<body>
    <h1>Aula 5 - Exemplo 4</h1>
    <h3>Exemplo do rowspan</h3>
    <table>
        <tr>
            <th>Aula</th>
            <th>Quarta-Feira</th>
            <th>Quinta-Feira</th>
            <th>Sexta-Feira</th>
        </tr>
        <tr>
            <td>1ª aula</td>
            <td rowspan="2">AD/PA</td>
            <td>Matemática</td>
            <td>Química</td>
        </tr>
        <tr>
            <td>2ª aula</td>
            <td>Português</td>
            <td rowspan="2">Ed.Física</td>
        </tr>
        <tr>
            <td>3ª aula</td>
            <td>Artes</td>
            <td rowspan="2">BD/IW1</td>
        </tr>
        <tr>
            <td>4ª aula</td>
            <td>Geografia</td>
            <td>Biologia</td>
            
        </tr>
        <tr>
            <td>5ª aula</td>
            <td rowspan="2">Inglês</td>
            <td>Química</td>
            <td rowspan="2">IW1/BD</td>
        </tr>
        <tr>
            <td>6ª aula</td>
            <td>Matemática</td>
            
           
        </tr>
    </table>

</body>

</html>
